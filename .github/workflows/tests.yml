name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      # Не останавливать вторую версию Python, если упала первая: видно, где именно проблема.
      fail-fast: false
      matrix:
        # Самая старая поддерживаемая версия и та, что в Docker-образе.
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker compose build
      # Раннер GitHub работает под uid 1001, а контейнер под 1000: без этого
      # контейнер не сможет создать базу в смонтированной папке data/.
      - run: chmod 777 data
      - name: Сгенерировать и импортировать тестовый лог
        run: |
          docker compose run --rm cli generate --days 3
          docker compose run --rm cli import /app/data/generated/auth.log --tz Europe/Moscow
      # Ждём сами, а не через `up --wait`: при ошибке этот же шаг печатает
      # состояние контейнера, историю healthcheck и его лог.
      - name: Запустить API и дождаться ответа
        run: |
          docker compose up -d api
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/health; then exit 0; fi
            sleep 2
          done
          echo "::group::Состояние контейнеров"
          docker compose ps --all
          echo "::endgroup::"
          echo "::group::Проверки здоровья API"
          docker inspect --format '{{json .State.Health}}' "$(docker compose ps --all --quiet api)"
          echo "::endgroup::"
          echo "Лог API:"
          docker compose logs api
          exit 1
      - name: Запустить дашборд и дождаться ответа
        run: |
          docker compose up -d dashboard
          for attempt in $(seq 1 30); do
            if curl --fail --silent --output /dev/null http://127.0.0.1:8001; then exit 0; fi
            sleep 2
          done
          docker compose ps --all
          echo "Лог дашборда:"
          docker compose logs dashboard
          exit 1
      - if: always()
        run: docker compose down
