[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "attack-analyzer"
version = "1.0.0"
description = "Анализатор атак на VPS по логам SSH (auth.log / journalctl)"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "hatyl67" }]
dependencies = [
    # pandas 3 меняет типы строк и поведение копий; проект проверен на 2.x.
    "pandas>=2.0,<3",
    "SQLAlchemy>=2.0",
    # tomllib появился в стандартной библиотеке только в Python 3.11.
    "tomli>=1.1; python_version < '3.11'",
    # База часовых поясов для zoneinfo: на Windows и в slim-образах её нет.
    "tzdata",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "matplotlib>=3.7",
    "shiny>=1.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Repository = "https://github.com/hatyl67/vps-attack-analyzer"

[project.scripts]
attack-analyzer = "attack_analyzer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Тесты видят пакет из src/ даже без `pip install -e .`
pythonpath = ["src"]
# Последний matplotlib для Python 3.9 вызывает устаревшие функции pyparsing.
# Это не наш код, а шум мешает заметить настоящие предупреждения.
filterwarnings = ["ignore::DeprecationWarning:matplotlib.*"]
